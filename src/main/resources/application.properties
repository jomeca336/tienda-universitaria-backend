spring.application.name=ecomerce

server.port=8080

# Database - lee desde variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT - lee desde variables de entorno
security.jwt.secret=${JWT_SECRET:ecomerce-super-secret-key-change-me-32chars!!}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# CORS - lee desde variables de entorno
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
