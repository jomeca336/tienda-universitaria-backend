spring.application.name=ecomerce

# =============================================
# PostgreSQL - Actualiza estos valores cuando
# tengas tu base de datos lista
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomerce_db
spring.datasource.username=postgres
spring.datasource.password=tu_password_aqui
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT
# IMPORTANTE: Cambia este secret por uno seguro (minimo 32 caracteres)
security.jwt.secret=ecomerce-super-secret-key-change-me-32chars!!
security.jwt.expiration-seconds=3600

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
